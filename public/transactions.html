<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Redirecionando...</title>
    <meta http-equiv="refresh" content="0; url=./transactions/" />
    <script>
      (function redirectToAppRoute() {
        var currentPath = window.location.pathname;
        var nextPath = currentPath.replace(/transactions\.html$/, 'transactions/');
        if (nextPath === currentPath) {
          nextPath = './transactions/';
        }
        window.location.replace(nextPath + window.location.search + window.location.hash);
      })();
    </script>
  </head>
  <body>
    <p>Redirecionando para a página de transações...</p>
  </body>
</html>
